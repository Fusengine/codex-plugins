# /etc/haproxy/haproxy.cfg - TLS-terminating HTTP proxy with health checks and a per-IP rate limit
# (HAProxy 3.4 LTS). Directives verified in the HAProxy docs through Context7 /haproxy/docs, 2026-11-10.
# Check:   haproxy -c -f /etc/haproxy/haproxy.cfg
# Reload:  systemctl reload haproxy   (seamless; run the check first)
# The `crt` file is the certificate chain + private key concatenated in one PEM.

global
    log /dev/log local0
    maxconn 20000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend www
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/app.example.com.pem alpn h2,http/1.1 ssl-min-ver TLSv1.2
    http-request redirect scheme https unless { ssl_fc }

    # per-IP request rate limit through a stick table
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }

    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    option forwardfor
    default_backend app

backend app
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz
    default-server inter 3s rise 2 fall 3
    server app1 127.0.0.1:8080 check
    server app2 127.0.0.1:8081 check
