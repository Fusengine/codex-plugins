# /etc/nginx/conf.d/app.conf - TLS-terminating reverse proxy with correct proxy headers.
# Directives verified at nginx.org (ngx_http_proxy_module, ngx_http_v2_module, ngx_http_v3_module,
# ngx_http_limit_req_module, websocket.html) through Context7 /websites/nginx_en, 2026-11-10.
# Test before reload:  nginx -t   then   systemctl reload nginx   (reload keeps old workers on error).

# rate limit zone (http context: this file is included inside http{})
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

# WebSocket support: only send "Connection: upgrade" when the client asked for an upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    # ACME HTTP-01 webroot, then redirect everything else
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;          # HTTP/3: needs nginx built with ngx_http_v3_module
    listen [::]:443 quic reuseport;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_req zone=perip burst=20 nodelay;

        proxy_pass http://app_backend;
        proxy_http_version 1.1;                      # required for keepalive to the upstream on < 1.29.7
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
