# /etc/unbound/unbound.conf.d/split-horizon.conf - recursive resolver for the LAN with a
# private view of an internal zone (split horizon) and forwarding of one zone.
# Options verified in https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html
# (Context7 /websites/unbound_nlnetlabs_nl_en, 2026-11-10).
# Check:  unbound-checkconf       Reload: systemctl reload unbound (or `unbound-control reload`)
# systemd-resolved owns 127.0.0.53:53; bind Unbound to a different address/interface or disable
# the resolved stub listener (references/dns.md), else Unbound fails with "address in use".

server:
    interface: 192.0.2.53          # REPLACE with the resolver's LAN address
    access-control: 127.0.0.0/8 allow
    access-control: 192.0.2.0/24 allow      # LAN only; never allow 0.0.0.0/0 (open resolver)
    # Internal view: answers from local-data are authoritative for this zone and only for LAN clients
    local-zone: "corp.example.com." transparent
    local-data: "git.corp.example.com. IN A 192.0.2.20"
    local-data: "nas.corp.example.com. IN A 192.0.2.30"

# Send one internal zone to another recursive/authoritative server
forward-zone:
    name: "lab.example.com."
    forward-addr: 192.0.2.54
