# /etc/wireguard/wg0.conf on the server (chmod 600, owner root)
# Keys:  umask 077; wg genkey | tee privatekey | wg pubkey > publickey
# Syntax of wg-quick keys: https://git.zx2c4.com/wireguard-tools/about/src/man/wg-quick.8
#
# Road-warrior hub: clients get 10.8.0.0/24, server is 10.8.0.1.
# Open UDP 51820 in the firewall (templates/nftables.conf already does).

[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = <SERVER_PRIVATE_KEY>
# Table = off          # uncomment to stop wg-quick from adding routes itself

# Only if clients must reach the Internet / LAN through this host:
#   sysctl -w net.ipv4.ip_forward=1   (persist in /etc/sysctl.d/), then a forward rule and
#   masquerade in the firewall. Do NOT use iptables PostUp lines on an nftables-only host.

[Peer]
# laptop
PublicKey = <LAPTOP_PUBLIC_KEY>
AllowedIPs = 10.8.0.2/32

[Peer]
# phone
PublicKey = <PHONE_PUBLIC_KEY>
AllowedIPs = 10.8.0.3/32
