# /etc/wireguard/wg0.conf on a client (chmod 600). Counterpart of wg0-server.conf.
#
# SPLIT TUNNEL (default here): only the VPN subnet and the listed LAN go through the tunnel.
# FULL TUNNEL: AllowedIPs = 0.0.0.0/0, ::/0  -> wg-quick installs an ip-rule override of the
# default route; a wrong endpoint or a dead server then cuts the client off from the Internet,
# and on a REMOTE client it cuts your SSH session. Never test a full tunnel on a remote host
# without a scheduled `wg-quick down wg0` (see references/safe-network-changes.md).

[Interface]
Address = 10.8.0.2/24
PrivateKey = <LAPTOP_PRIVATE_KEY>
# DNS = 10.8.0.1       # wg-quick runs `resolvconf -a tun.wg0 -m 0 -x`; needs resolvconf (see wg-quick(8))

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
Endpoint = vpn.example.com:51820
AllowedIPs = 10.8.0.0/24, 192.168.10.0/24
PersistentKeepalive = 25      # only for a peer behind NAT that must receive traffic
