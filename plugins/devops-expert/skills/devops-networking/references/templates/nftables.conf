#!/usr/sbin/nft -f
# Default-deny host firewall: SSH + HTTP(S) + WireGuard.
# Based on https://wiki.nftables.org/wiki-nftables/index.php/Simple_ruleset_for_a_server
#
# BEFORE USE
#   1. Set ssh_port, wan_if, wg_if, admin_nets to the real values (admin_nets: where SSH may come from).
#   2. Check:  nft -c -f nftables.conf          (syntax only, changes nothing)
#   3. Apply with the timed auto-revert: templates/nft-safe-apply.sh  (never plain `nft -f` on a remote host).
#
# WARNING: `flush ruleset` deletes EVERY table, including tables owned by Docker, Podman,
# libvirt or kube-proxy. On such hosts use the own-table variant in references/nftables-firewall.md.

define ssh_port   = 22
define wg_port    = 51820
define wan_if     = "eth0"
define wg_if      = "wg0"
define admin_nets4 = { 192.0.2.0/24 }        # documentation ranges: REPLACE
define admin_nets6 = { 2001:db8:1::/48 }

flush ruleset

table inet firewall {

    chain inbound_ipv4 {
        # ping, rate limited
        icmp type echo-request limit rate 5/second accept
    }

    chain inbound_ipv6 {
        # neighbour discovery: without it IPv6 connectivity breaks
        icmpv6 type { nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } accept
        icmpv6 type echo-request limit rate 5/second accept
    }

    chain inbound {
        type filter hook input priority 0; policy drop;

        # established/related in, invalid out
        ct state vmap { established : accept, related : accept, invalid : drop }

        iifname "lo" accept

        meta protocol vmap { ip : jump inbound_ipv4, ip6 : jump inbound_ipv6 }

        # SSH only from the admin networks
        tcp dport $ssh_port ip saddr $admin_nets4 accept
        tcp dport $ssh_port ip6 saddr $admin_nets6 accept

        # web
        tcp dport { 80, 443 } accept
        udp dport 443 accept            # HTTP/3 (QUIC); remove if no HTTP/3 is served

        # WireGuard handshake/data from anywhere
        udp dport $wg_port accept

        # uncomment to log what is dropped (rate limited)
        # limit rate 5/minute log prefix "[nft] input drop: " counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # Router/VPN gateway: add `iifname $wg_if oifname $wan_if accept` here, plus NAT in a separate table.
    }

    # no output chain: default policy is accept
}
