# Project-level ansible.cfg. Search order: ANSIBLE_CONFIG, ./ansible.cfg, ~/.ansible.cfg, /etc/ansible/ansible.cfg
# (first file found wins). Ansible ignores ./ansible.cfg when the directory is world-writable.
# Relative paths below resolve against this file's directory.
# Full reference: `ansible-config init --disabled > ansible.cfg` generates every option, commented out.

[defaults]
# Default to STAGING so a bare command can never touch production; production needs an explicit -i.
inventory = inventories/staging
roles_path = roles
collections_path = collections

# Parallelism: default is 5. Raise only after checking control node CPU/RAM and target tolerance.
forks = 10

# smart: gather facts once per host per run and reuse the cache plugin.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 86400

# Host key checking stays ON (the default). Do not switch it off for production fleets.
host_key_checking = True

# Pin discovery noise down; set ansible_python_interpreter per group when a host needs a fixed path.
interpreter_python = auto_silent

[connection]
# Fewer SSH round trips. Needs "requiretty" disabled in sudoers when using become with sudo;
# does not apply to modules that transfer files.
pipelining = True
