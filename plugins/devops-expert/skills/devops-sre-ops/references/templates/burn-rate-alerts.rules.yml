# Multi-window, multi-burn-rate SLO alerts (SRE Workbook, "Alerting on SLOs").
# Placeholders to replace before use:
#   http_requests_total{code=~"5.."}  -> your request counter and your "bad" selector
#   job                               -> your aggregation label (service)
#   0.001                             -> error budget = 1 - SLO (SLO 99.9% over 30 days)
#   runbook URLs                      -> real runbooks (references/templates/runbook.md)
# For another SLO, recompute thresholds as burn_rate * (1 - SLO); the burn-rate factors
# (14.4, 6, 3, 1) are the 99.9% / 30 day values from the source and consume 2%, 5%, 10%, 10%
# of the budget: consumed = burn_rate * long_window / 720h.
# Validate: promtool check rules burn-rate-alerts.rules.yml  (exit 0 = valid, 1 = error)
groups:
  - name: slo-recording-shop-availability
    interval: 1m
    rules:
      - record: job:slo_errors_per_request:ratio_rate5m
        expr: |
          sum by (job) (rate(http_requests_total{code=~"5.."}[5m]))
          /
          sum by (job) (rate(http_requests_total[5m]))
      - record: job:slo_errors_per_request:ratio_rate30m
        expr: |
          sum by (job) (rate(http_requests_total{code=~"5.."}[30m]))
          /
          sum by (job) (rate(http_requests_total[30m]))
      - record: job:slo_errors_per_request:ratio_rate1h
        expr: |
          sum by (job) (rate(http_requests_total{code=~"5.."}[1h]))
          /
          sum by (job) (rate(http_requests_total[1h]))
      - record: job:slo_errors_per_request:ratio_rate2h
        expr: |
          sum by (job) (rate(http_requests_total{code=~"5.."}[2h]))
          /
          sum by (job) (rate(http_requests_total[2h]))
      - record: job:slo_errors_per_request:ratio_rate6h
        expr: |
          sum by (job) (rate(http_requests_total{code=~"5.."}[6h]))
          /
          sum by (job) (rate(http_requests_total[6h]))
      - record: job:slo_errors_per_request:ratio_rate1d
        expr: |
          sum by (job) (rate(http_requests_total{code=~"5.."}[1d]))
          /
          sum by (job) (rate(http_requests_total[1d]))
      - record: job:slo_errors_per_request:ratio_rate3d
        expr: |
          sum by (job) (rate(http_requests_total{code=~"5.."}[3d]))
          /
          sum by (job) (rate(http_requests_total[3d]))

  - name: slo-alerts-shop-availability
    rules:
      # Page: 2% of the 30-day budget in 1 hour (burn rate 14.4), still burning in the last 5 minutes.
      - alert: ErrorBudgetBurnFastPage
        expr: |
          job:slo_errors_per_request:ratio_rate1h > (14.4 * 0.001)
          and
          job:slo_errors_per_request:ratio_rate5m > (14.4 * 0.001)
        labels:
          severity: page
          slo: shop-availability-99.9
        annotations:
          summary: "{{ $labels.job }}: fast error budget burn (14.4x), 2% of the 30d budget per hour"
          description: "Error ratio over 1h and 5m is above 1.44%. At this rate the budget is gone in about 50h."
          runbook_url: "https://runbooks.example.internal/shop/error-budget-burn"

      # Page: 5% of the budget in 6 hours (burn rate 6), still burning in the last 30 minutes.
      - alert: ErrorBudgetBurnSlowPage
        expr: |
          job:slo_errors_per_request:ratio_rate6h > (6 * 0.001)
          and
          job:slo_errors_per_request:ratio_rate30m > (6 * 0.001)
        labels:
          severity: page
          slo: shop-availability-99.9
        annotations:
          summary: "{{ $labels.job }}: error budget burn (6x), 5% of the 30d budget in 6h"
          description: "Error ratio over 6h and 30m is above 0.6%. At this rate the budget is gone in about 5 days."
          runbook_url: "https://runbooks.example.internal/shop/error-budget-burn"

      # Ticket (optional, from the chapter's rule example): 10% of the budget in 24 hours (burn rate 3).
      - alert: ErrorBudgetBurnTicketDaily
        expr: |
          job:slo_errors_per_request:ratio_rate1d > (3 * 0.001)
          and
          job:slo_errors_per_request:ratio_rate2h > (3 * 0.001)
        labels:
          severity: ticket
          slo: shop-availability-99.9
        annotations:
          summary: "{{ $labels.job }}: error budget burn (3x), 10% of the 30d budget in 24h"
          description: "Error ratio over 1d and 2h is above 0.3%. Budget gone in about 10 days if it continues."
          runbook_url: "https://runbooks.example.internal/shop/error-budget-burn"

      # Ticket: 10% of the budget in 3 days (burn rate 1), still burning in the last 6 hours.
      - alert: ErrorBudgetBurnTicketSlow
        expr: |
          job:slo_errors_per_request:ratio_rate3d > (1 * 0.001)
          and
          job:slo_errors_per_request:ratio_rate6h > (1 * 0.001)
        labels:
          severity: ticket
          slo: shop-availability-99.9
        annotations:
          summary: "{{ $labels.job }}: error budget burn (1x), 10% of the 30d budget in 3d"
          description: "Error ratio over 3d and 6h is above 0.1%. Budget gone in 30 days if it continues."
          runbook_url: "https://runbooks.example.internal/shop/error-budget-burn"

  - name: slo-rule-pipeline-health
    rules:
      # The alert design depends on timely evaluation; a skipped iteration leaves gaps in the recorded series.
      # The docs page names the metric rule_group_iterations_missed_total; confirm the exact exported name
      # (with its prometheus_ prefix) on your server's /metrics before relying on this rule.
      - alert: SLORuleGroupIterationsMissed
        expr: increase(prometheus_rule_group_iterations_missed_total[15m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Rule group {{ $labels.rule_group }} skipped evaluations"
          description: "SLO recording or alert rules did not finish within their interval; burn-rate alerts may be late."
          runbook_url: "https://runbooks.example.internal/monitoring/rule-evaluation"
