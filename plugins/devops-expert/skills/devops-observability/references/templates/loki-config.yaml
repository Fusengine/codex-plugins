# Loki 3.7 single-binary, filesystem storage. Derived from cmd/loki/loki-local-config.yaml (v3.7.9)
# plus the compactor retention settings from operations/storage/retention.md.
# Single node only: for object storage and scale-out follow the Loki "install" docs.
# Run:  loki -config.file=/etc/loki/loki-config.yaml
# No offline linter was verified for Loki: check by starting it in a scratch container and reading /ready.
auth_enabled: false            # single tenant; with true every request needs X-Scope-OrgID

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h            # retention requires a 24h index period

limits_config:
  retention_period: 744h       # 31 days; not retroactive for logs already ingested
  # retention_stream:          # per-stream override, period must be >= 24h
  #   - selector: '{namespace="dev"}'
  #     priority: 1
  #     period: 72h

compactor:
  working_directory: /loki/retention
  retention_enabled: true      # without it the compactor only compacts
  delete_request_store: filesystem   # required when retention is enabled
  retention_delete_delay: 2h   # window to notice a retention mistake before chunks are swept

ruler:
  alertmanager_url: http://alertmanager:9093

analytics:
  reporting_enabled: false
