# Single-host monitoring stack for a lab or small server (Compose file, no "version:" key).
# Put next to this file: prometheus.yml, rules-alerts.yml, rules-recording.yml, alertmanager.yml, blackbox.yml,
# loki-config.yaml, alloy-host.alloy, grafana-datasources.yaml, grafana-dashboards-provider.yaml,
# file-sd-nodes.yml (rename as shown below) and a .env with GRAFANA_ADMIN_PASSWORD (never commit it).
# Validate:  docker compose -f docker-compose-monitoring.yaml config
# Alloy (alloy-host.alloy) already ships host metrics through remote write, so this stack does NOT run
# node_exporter: do not add both for the same host or every host series is duplicated.
# grafana-datasources.yaml also declares Tempo, which this stack does not run: delete that block or add Tempo.
# Ports bind to 127.0.0.1: put a reverse proxy with TLS and auth in front for remote access.
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle              # allows POST /-/reload; the admin API stays OFF
      - --web.enable-remote-write-receiver  # receives Alloy remote write
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules-alerts.yml:/etc/prometheus/rules/rules-alerts.yml:ro
      - ./rules-recording.yml:/etc/prometheus/rules/rules-recording.yml:ro
      - ./file-sd-nodes.yml:/etc/prometheus/targets/node-example.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro     # slack_api_url, pagerduty_routing_key, ... (files, mode 0400)
      - alertmanager-data:/alertmanager            # silences and notification log survive restarts
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/config/blackbox.yml"]
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-host.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana-dashboards-provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
