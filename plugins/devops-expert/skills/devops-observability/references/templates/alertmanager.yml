# Alertmanager configuration (keys checked in configuration.md of v0.35.0).
# Validate:  amtool check-config alertmanager.yml
# Test routing:  amtool config routes test --config.file=alertmanager.yml --tree --verify.receivers=oncall-pager severity=page team=sre
# Secrets are read from files (api_url_file, routing_key_file, url_file): mount them, never inline them.
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_api_url

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: team-default            # the root route matches every alert and carries no matchers
  group_by: [alertname, cluster, service]
  group_wait: 30s                   # default 30s: lets inhibiting alerts arrive first
  group_interval: 5m                # default 5m
  repeat_interval: 4h               # default 4h; keep it a multiple of group_interval
  routes:
    - matchers: [alertname = "Watchdog"]
      receiver: deadmans-switch
      group_wait: 0s
      repeat_interval: 1m
    - matchers: [severity = "page"]
      receiver: oncall-pager
      continue: false
    - matchers: [severity = "ticket"]
      receiver: team-tickets
      active_time_intervals: [business-hours]   # route only notifies inside the window (not inherited by children)

inhibit_rules:
  # A node-level outage hides the per-service symptoms that come from the same host.
  - name: node-down-hides-service-alerts
    source_matchers: [alertname = "TargetDown", job = "node"]
    target_matchers: [severity =~ "page|ticket"]
    equal: [instance]
  # A page-level alert hides the ticket-level one for the same alert name and cluster.
  - name: page-hides-ticket
    source_matchers: [severity = "page"]
    target_matchers: [severity = "ticket"]
    equal: [alertname, cluster]

time_intervals:
  - name: business-hours
    time_intervals:
      - weekdays: ["monday:friday"]
        times:
          - start_time: "08:00"
            end_time: "18:00"
        location: "Europe/Zurich"

receivers:
  - name: team-default
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ if .Annotations.runbook_url }} - {{ .Annotations.runbook_url }}{{ end }}{{ "\n" }}{{ end }}'
  - name: team-tickets
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ticket_webhook_url
        send_resolved: true
  - name: oncall-pager
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        send_resolved: true
  - name: deadmans-switch
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/deadmans_switch_url
        send_resolved: false
