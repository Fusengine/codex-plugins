# Template: sshd drop-in - key-only logins for members of one group.
# Install: /etc/ssh/sshd_config.d/10-hardening.conf (low number: for most keywords the FIRST
#          obtained value wins, so this file must sort before others that set the same keys).
# Before applying:
#   1. Keep a second root session open (rollback path).
#   2. Ensure your admin account has a working key AND is in the AllowGroups group:
#        groupadd -f sshusers && usermod -aG sshusers <admin>
#   3. sshd -t                                   # must print nothing
#   4. sshd -T | grep -Ei 'passwordauth|permitroot|allowgroups|authenticationmethods'
#   5. systemctl reload ssh   (Debian/Ubuntu)  |  systemctl reload sshd   (RHEL family)
#   6. Test a NEW login from another terminal before closing the spare session.
# Sources: https://man.openbsd.org/sshd_config , https://man.openbsd.org/sshd
#          https://documentation.ubuntu.com/server/how-to/security/openssh-server/

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Only members of this group may log in (lock-out risk: see step 2).
AllowGroups sshusers

MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# No forwarding on application servers; remove on a bastion that needs ProxyJump.
DisableForwarding yes
X11Forwarding no

LogLevel VERBOSE

# Example: allow password auth only from a management subnet (Match blocks go last).
# Match Address 10.10.0.0/24
#     PasswordAuthentication yes
#     AuthenticationMethods publickey,password
