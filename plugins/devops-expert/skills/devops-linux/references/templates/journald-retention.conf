# Template: journald drop-in - persistent logs with size and age caps.
# Install: /etc/systemd/journald.conf.d/10-retention.conf, then
#   systemd-analyze cat-config systemd/journald.conf   # effective merged config
#   systemctl restart systemd-journald
#   journalctl --disk-usage
# Source: https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
# Note: the compiled-in default for Storage= differs between builds; set it explicitly.

[Journal]
# Keep logs across reboots (/var/log/journal), fall back to /run during early boot.
Storage=persistent
# Disk cap for the persistent journal, and free space to leave on the filesystem.
SystemMaxUse=2G
SystemKeepFree=1G
# Drop entries older than 30 days.
MaxRetentionSec=30day
Compress=yes
# Per-service flood protection: at most 10000 messages per 30s per service.
RateLimitIntervalSec=30s
RateLimitBurst=10000
# Set to yes only if a syslog daemon (rsyslog) ships logs off-host.
ForwardToSyslog=no
