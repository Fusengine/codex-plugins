# Template: dnf-automatic policy (RHEL family, dnf 4).
# Install: /etc/dnf/automatic.conf (merge with the packaged file; keep unlisted keys).
# Enable:  systemctl enable --now dnf-automatic.timer        # behaves as this file says
#          systemctl list-timers 'dnf*'
# dnf5 hosts (check "dnf --version"): the timer is dnf5-automatic.timer and the packaged
#          defaults live in /usr/share/dnf5/dnf5-plugins/automatic.conf; override in /etc/dnf/automatic.conf.
# Reboot check after a run:  needs-restarting -r ; echo $?   (1 = reboot needed)
# Sources: https://dnf.readthedocs.io/en/latest/automatic.html
#          https://dnf5.readthedocs.io/en/latest/dnf5_plugins/automatic.8.html
#          https://dnf-plugins-core.readthedocs.io/en/latest/needs_restarting.html

[commands]
# "security" = only updates with an issued security advisory; "default" = everything.
upgrade_type = security
# Download and install (apply_updates implies download_updates).
download_updates = yes
apply_updates = yes
# Extra random delay before downloading, in seconds (the timers already add up to 1 h).
random_sleep = 0
# never | when-changed | when-needed  (default: never). Use when-needed only with a
# maintenance window and monitoring.
reboot = never
# reboot_command = "shutdown -r +5 'Rebooting after applying package updates'"

[emitters]
# stdio lands in the journal of the timer's service; add "email" or "motd" if wanted.
emit_via = stdio

# [base] overrides options of dnf's main configuration (see the DNF Configuration Reference);
# leave it as packaged unless a specific dnf.conf option must differ for unattended runs.
