# StatefulSet with headless Service and one PVC per replica.
# Replace: shop, db, image, port, storage class, size, probes.
# Data safety: PVCs are retained on StatefulSet delete and scale-down (stable since v1.32).
# The StorageClass "fast-retain" should set reclaimPolicy: Retain and
# volumeBindingMode: WaitForFirstConsumer - read `kubectl get sc` for the real name.
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: shop
  labels:
    app.kubernetes.io/name: db
spec:
  clusterIP: None # headless: per-pod DNS db-0.db-headless.shop.svc
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: tcp-db
      port: 5432
      targetPort: tcp-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: shop
  labels:
    app.kubernetes.io/name: db
spec:
  serviceName: db-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  minReadySeconds: 10
  revisionHistoryLimit: 5
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0 # raise to stage a canary on the highest ordinals
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
    spec:
      serviceAccountName: db
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120 # time to flush and shut down cleanly
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: db
      containers:
        - name: db
          image: registry.example.com/shop/db:17.6 # placeholder: pin the real tag/digest
          ports:
            - name: tcp-db
              containerPort: 5432
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi # requests = limits -> Guaranteed QoS
          startupProbe:
            tcpSocket:
              port: tcp-db
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: tcp-db # replace with an exec/app-level check where the image provides one
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/db
  volumeClaimTemplates:
    - metadata:
        name: data # PVCs are named data-db-0, data-db-1, ...
      spec:
        accessModes: ["ReadWriteOncePod"] # CSI volumes only; use ReadWriteOnce otherwise
        storageClassName: fast-retain
        resources:
          requests:
            storage: 50Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: db
  namespace: shop
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
