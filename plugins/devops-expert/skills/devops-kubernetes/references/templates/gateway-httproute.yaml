# Gateway API (standard channel, gateway.networking.k8s.io/v1) - shared Gateway + HTTPS redirect + app route.
# Prerequisites: CRDs from a pinned release (v1.7.0 standard-install.yaml, server-side apply) and a
# controller providing the GatewayClass "shared-gateway-class" - read `kubectl get gatewayclass`.
# ReferenceGrant is v1 since Gateway API v1.5; on older CRDs use the version they serve.
# Layout: Gateway in "infra", certificate Secret in "certs", app route + Service in "shop".
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared
  namespace: infra
spec:
  gatewayClassName: shared-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: Same # only the redirect route in infra attaches here
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-example-com
            namespace: certs # cross-namespace: needs the ReferenceGrant below
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              shared-gateway-access: "true" # label app namespaces deliberately
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-infra-gateways
  namespace: certs # lives in the namespace being referenced
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: infra
  to:
    - group: ""
      kind: Secret
      name: wildcard-example-com # always set name: omitting it grants every Secret in "certs"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: infra
spec:
  parentRefs:
    - name: shared
      sectionName: http
  hostnames:
    - "*.example.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: shop # namespace must carry shared-gateway-access: "true"
spec:
  parentRefs:
    - name: shared
      namespace: infra
      sectionName: https
  hostnames:
    - shop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web # canary: add a second backendRef and split with weight
          port: 80
          weight: 100
