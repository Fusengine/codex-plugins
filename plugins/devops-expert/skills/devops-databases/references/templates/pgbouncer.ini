; pgbouncer.ini - transaction pooling for web applications. PgBouncer 1.26.1 or later (CVE fixes, 2026-10-14).
; Comments are on their own lines on purpose (INI parsers keep inline comments inside the value).
; Placeholders: CHANGE_ME_*. No password is stored here: users live in auth_file / auth_query (secret store: devops-secrets).
; Reload: connect to the admin console and run RELOAD;  (or systemctl reload)  - read SHOW POOLS; before and after.

[databases]
; One entry per database. host is the PRIMARY endpoint (HAProxy/VIP in front of Patroni, or the CNPG -rw service).
appdb = host=CHANGE_ME_primary_endpoint port=5432 dbname=appdb
; Read-only pool pointing at a replica endpoint (separate logical name):
appdb_ro = host=CHANGE_ME_replica_endpoint port=5432 dbname=appdb

[pgbouncer]
listen_addr = CHANGE_ME_private_ip
listen_port = 6432
unix_socket_dir = /var/run/postgresql

; --- Pooling ---
; transaction: server connection released when the transaction ends. Session state (SET, LISTEN, session advisory locks,
; SQL PREPARE, WITH HOLD cursors) does NOT work in this mode. Use session mode for tools that need it.
pool_mode = transaction
; Per user/database pair (default 20). Sum over pairs must stay below PostgreSQL max_connections minus reserved sessions.
default_pool_size = 20
; Extra server connections for bursts, used after reserve_pool_timeout seconds of waiting.
reserve_pool_size = 5
reserve_pool_timeout = 5
; Client connections allowed (default 100). Raise the service LimitNOFILE accordingly.
max_client_conn = 1000
; Hard cap of server connections per database across users.
max_db_connections = 80
; Protocol-level prepared statements in transaction mode (1.21.0+). 0 disables. Larger than the app's common statements.
max_prepared_statements = 100
; Clients waiting for a server connection longer than this are disconnected (default 120).
query_wait_timeout = 60
server_idle_timeout = 600
server_lifetime = 3600
; 1.26.0 tracks search_path by default on PostgreSQL 18; uncomment to restore the 1.25 behaviour if it causes trouble.
; ignore_startup_parameters = search_path

; --- Authentication ---
; SCRAM everywhere. auth_type defaults to md5, set it explicitly.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Users not in auth_file are looked up in the database through a non-superuser SECURITY DEFINER function
; installed in EVERY database the pool serves. auth_user must exist in auth_file.
; The function must return two columns (user name, password hash) and no row for an unknown user. Pattern, run once
; per database by a superuser after review (a change, ask first):
;   CREATE SCHEMA pgbouncer AUTHORIZATION pgbouncer_owner;
;   CREATE FUNCTION pgbouncer.get_auth(p_usename text) RETURNS TABLE(usename name, passwd text)
;     LANGUAGE sql SECURITY DEFINER SET search_path = pg_catalog
;     AS $$ SELECT rolname, rolpassword FROM pg_authid WHERE rolname = p_usename AND rolcanlogin $$;
;   REVOKE ALL ON FUNCTION pgbouncer.get_auth(text) FROM PUBLIC;
;   GRANT EXECUTE ON FUNCTION pgbouncer.get_auth(text) TO pgbouncer_auth;
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

; --- TLS ---
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/pgbouncer/tls/ca.crt

; --- Admin console (connect to the virtual database "pgbouncer") ---
admin_users = pgbouncer_admin
stats_users = monitor_user

; --- Logging ---
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
log_connections = 0
log_disconnections = 0
