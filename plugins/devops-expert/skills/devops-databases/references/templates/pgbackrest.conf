# pgbackrest.conf - /etc/pgbackrest/pgbackrest.conf (pgBackRest 2.60.0)
# Local POSIX repository on a dedicated volume + optional second repository on S3-compatible storage.
# Option names checked against https://pgbackrest.org/configuration.html (2026-11-10).
# No secret is stored here: the cipher passphrase and S3 keys come from files or environment injected by the secret store
# (devops-secrets); the values below are placeholders. Keep the file mode 0640, owner postgres.
# The repository volume must NOT be the database volume (devops-storage-backup covers 3-2-1 and offsite copies).

[global]
# --- Repository 1: local, fast restores, short retention ---
repo1-path=/var/lib/pgbackrest
# Keep 2 full backups; differentials expire with their full, incrementals with their parent.
repo1-retention-full=2
repo1-retention-diff=6
# Block-level incremental saves space; bundling combines small files (fewer objects, helps on object stores).
# Both are repository options: read their notes on pgbackrest.org/configuration.html before enabling on an existing stanza.
repo1-block=y
repo1-bundle=y
# Optional encryption at rest of the repository. Use a passphrase from the secret store. Stanzas created with
# pgBackRest older than 2.59.3 may hold weak subkeys: read the 2026-10-04 notice on pgbackrest.org/news.html first.
#repo1-cipher-type=aes-256-cbc
#repo1-cipher-pass=CHANGE_ME_from_secret_store

# --- Repository 2: object storage, longer retention (uncomment and fill) ---
#repo2-type=s3
#repo2-path=/pgbackrest
#repo2-s3-bucket=CHANGE_ME_bucket
#repo2-s3-endpoint=CHANGE_ME_s3_endpoint
#repo2-s3-region=CHANGE_ME_region
#repo2-s3-key=CHANGE_ME_access_key
#repo2-s3-key-secret=CHANGE_ME_secret_key
#repo2-retention-full=8

# --- Behaviour ---
# Parallel processes for backup/restore/archive. Raise to the number of spare cores, watch I/O.
process-max=4
# Force an immediate checkpoint at backup start instead of waiting for a spread one.
start-fast=y
# zst (Zstandard) and lz4 are faster than the gz default but "not available on all platforms": check pgbackrest version/build.
compress-type=zst
compress-level=3
# Take backups from a standby when one is configured (reduces primary load); needs the standby stanza entries below.
#backup-standby=prefer
# Log level on console/file.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[global:archive-push]
# Asynchronous archiving: batches WAL and reuses connections. Needs a spool path on local disk.
archive-async=y
spool-path=/var/spool/pgbackrest

[global:archive-get]
archive-async=y
spool-path=/var/spool/pgbackrest

# One section per stanza. Name must match archive_command in postgresql.conf.
[main]
pg1-path=/var/lib/postgresql/18/main
pg1-port=5432
pg1-socket-path=/var/run/postgresql
# Standby example (second host), used by backup-standby:
#pg2-host=CHANGE_ME_standby_host
#pg2-host-user=postgres
#pg2-path=/var/lib/postgresql/18/main
