# postgresql-tuned.conf - starting fragment for PostgreSQL 17/18 on a DEDICATED host
# Assumed sizing for the numbers: 8 vCPU, 32 GB RAM, NVMe/SSD, WAL archived with pgBackRest.
# Put it in a file included from postgresql.conf (include_dir 'conf.d') so it is easy to diff.
# Do NOT use on a Patroni or CloudNativePG member: put these keys in the manager's config instead.
# Defaults quoted are the PostgreSQL 18 manual defaults (read 2026-11-10). Measure, then change one thing at a time.
# Restart needed: shared_buffers, max_connections, wal_level, archive_mode, max_wal_senders,
#                 max_replication_slots, shared_preload_libraries. Everything else: reload.

# --- Connections -----------------------------------------------------------------
listen_addresses = 'CHANGE_ME_private_ip'      # never '*' on a routable network; pair with pg_hba.conf
max_connections = 200                          # default 100. Keep LOW and pool with PgBouncer; each backend costs memory
superuser_reserved_connections = 5             # default 3. Headroom for emergency superuser logins

# --- Memory ----------------------------------------------------------------------
shared_buffers = 8GB                           # default 128MB. ~25% of RAM on a dedicated server; >40% rarely helps
effective_cache_size = 22GB                    # default 4GB. Planner hint only: buffers + OS cache (~70% of RAM). Reserves nothing
work_mem = 16MB                                # default 4MB. PER sort/hash NODE PER QUERY: 200 sessions x several nodes can exceed RAM.
                                               #   Raise per role/session for reporting jobs, not globally
maintenance_work_mem = 1GB                     # default 64MB. VACUUM, CREATE INDEX. Autovacuum may use workers x this
autovacuum_work_mem = 512MB                    # default -1 (use maintenance_work_mem). Caps each autovacuum worker explicitly

# --- WAL, checkpoints --------------------------------------------------------------
wal_level = replica                            # default replica. Set 'logical' ONLY if logical replication/decoding is needed
max_wal_size = 8GB                             # default 1GB (soft limit). Fewer forced checkpoints; larger = longer crash recovery
min_wal_size = 1GB                             # default 80MB. Keeps recycled WAL files to absorb bursts
checkpoint_timeout = 15min                     # default 5min. Make time, not WAL volume, trigger most checkpoints
checkpoint_completion_target = 0.9             # default 0.9. Spread checkpoint I/O; leave as is
wal_compression = lz4                          # default off. Less WAL volume for CPU; value 'lz4' needs a build with LZ4 (use 'on' otherwise)
log_checkpoints = on                           # default on. Compare timed vs requested checkpoints

# --- Archiving (point-in-time recovery) -------------------------------------------
archive_mode = on                              # default off. RESTART. Without it there is no PITR
archive_command = 'pgbackrest --stanza=main archive-push %p'   # stanza name must match pgbackrest.conf
archive_timeout = 5min                         # forces a WAL switch so an idle primary still ships WAL (bounds RPO); 0 disables

# --- Replication --------------------------------------------------------------------
max_wal_senders = 10                           # default 10. Replicas + pg_basebackup + backup tools + headroom
max_replication_slots = 10                     # default 10. Physical + logical slots
max_slot_wal_keep_size = 50GB                  # default -1 (unlimited!). CAP it: an abandoned slot otherwise fills the WAL disk.
                                               #   A slot beyond the cap is lost and its standby must be rebuilt. Alert before this
hot_standby = on                               # default on. Replicas serve reads
hot_standby_feedback = off                     # default off. 'on' prevents standby query cancels but can bloat the primary

# --- Authentication / TLS ---------------------------------------------------------
password_encryption = 'scram-sha-256'          # default scram-sha-256 in 18. md5 storage is deprecated
ssl = on                                       # then set the files below; certificates come from your PKI (devops-networking)
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'

# --- Safety timeouts ----------------------------------------------------------------
idle_in_transaction_session_timeout = '10min'  # default 0 (off). Kills sessions that hold locks and the xmin horizon while idle.
                                               #   Better set per application role; keep exceptions explicit
# lock_timeout and statement_timeout: set PER ROLE or per migration session, not globally (see schema-changes-safe.md)

# --- Logging ---------------------------------------------------------------------------
log_min_duration_statement = 500ms             # default -1 (off). Find slow queries; tune to your baseline
log_lock_waits = on                            # default off. Logs waits longer than deadlock_timeout
log_autovacuum_min_duration = 1min             # default 10min. Lower while tuning vacuum
log_line_prefix = '%m [%p] %q%u@%d '           # timestamp, pid, user@db: needed to correlate with pg_stat_activity

# --- Extensions requiring a restart -------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'   # RESTART. Then CREATE EXTENSION pg_stat_statements; in the target database
