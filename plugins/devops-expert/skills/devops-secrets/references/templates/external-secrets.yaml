# External Secrets Operator (external-secrets.io/v1) - placeholders only.
# 1) Namespaced SecretStore: HashiCorp Vault / KV v2, Kubernetes auth (no stored token).
# 2) ExternalSecret: what to fetch and which Secret to build.
# 3) ClusterSecretStore restricted by conditions to labelled namespaces.
# Prerequisite (Vault side): auth/kubernetes role bound to the ServiceAccount below,
# and the ServiceAccount bound to the system:auth-delegator ClusterRole.
# Do not copy the vault provider block to OpenBao without reading the ESO OpenBao
# provider page (alpha provider; fields not verified).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: CHANGE_ME_NAMESPACE
spec:
  provider:
    vault:
      server: "https://vault.example.internal:8200"
      path: "secret"          # KV mount name
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "CHANGE_ME_ROLE"
          serviceAccountRef:
            name: "eso-vault-reader"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db
  namespace: CHANGE_ME_NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: app-db              # the Kubernetes Secret ESO creates
    creationPolicy: Owner
    deletionPolicy: Retain    # confirm the default for your ESO version before relying on it
  data:
    - secretKey: password     # key inside the generated Secret
      remoteRef:
        key: app/db           # path under the KV mount
        property: password    # field inside the Vault secret
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-shared
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.example.internal/vault-shared: "allowed"
  provider:
    vault:
      server: "https://vault.example.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "CHANGE_ME_SHARED_ROLE"
          serviceAccountRef:
            name: "eso-vault-shared"
            namespace: "CHANGE_ME_ESO_NAMESPACE"
